name: Backend container

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-container.yml'
      - '.github/CODEOWNERS'
  push:
    branches:
      - main
      - main_v2
    paths:
      - 'backend/**'
      - '.github/workflows/backend-container.yml'
      - '.github/CODEOWNERS'
  workflow_dispatch:

concurrency:
  group: backend-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: backend
          GOOGLE_API_KEY: test
          PINECONE_API_KEY: test
        run: python -m unittest discover backend/tests

      - name: Build backend container
        run: docker build --tag portfolio-backend:test backend

  publish:
    name: Publish backend image
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/main_v2'))
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image_meta.outputs.image_ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: image_meta
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/portfolio-backend"
          echo "image_ref=${image}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_name=${image}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push backend image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image_meta.outputs.image_name }}"
          docker build \
            --build-arg BUILD_COMMIT="${GITHUB_SHA}" \
            --tag "${image}:${GITHUB_SHA}" \
            --tag "${image}:backend-latest" \
            backend
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:backend-latest"

  deploy:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: publish
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/main_v2'))
    environment:
      name: backend-webapp
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy container image to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ needs.publish.outputs.image_ref }}
