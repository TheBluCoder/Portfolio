name: Backend container

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-container.yml'
      - '.github/CODEOWNERS'
  push:
    branches:
      - backend
    paths:
      - 'backend/**'
      - '.github/workflows/backend-container.yml'
      - '.github/CODEOWNERS'
  workflow_dispatch:

concurrency:
  group: backend-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: backend
          GOOGLE_API_KEY: test
          PINECONE_API_KEY: test
        run: python -m unittest discover backend/tests

      - name: Build backend container
        run: docker build --tag portfolio-backend:test backend

  publish:
    name: Publish backend image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/backend'
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image_meta.outputs.image_ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: image_meta
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/portfolio-backend"
          echo "image_ref=${image}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_name=${image}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push backend image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image_meta.outputs.image_name }}"
          docker build \
            --tag "${image}:${GITHUB_SHA}" \
            --tag "${image}:backend-latest" \
            backend
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:backend-latest"

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/backend'
    environment:
      name: backend-container-app
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy image to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ needs.publish.outputs.image_ref }}
          registryUrl: ghcr.io
          registryUsername: ${{ secrets.GHCR_USERNAME }}
          registryPassword: ${{ secrets.GHCR_READ_TOKEN }}
